# Reusable portfolio CI — one place to define build/lint/test for every dessa-org repo.
#
# Per ADR 0004 (dessa-logs/decisions/0004-portfolio-devops-standard.md). Callers add a
# ~10-line .github/workflows/ci.yml (see workflow-templates/ci.yml) that does:
#   jobs: { ci: { uses: dessa-org/.github/.github/workflows/ci.yml@main } }
#
# Auto-detects stacks in the CALLER's tree — no per-repo config needed:
#   - Node:  every dir with a package.json (excluding node_modules) → install, then run any of
#            format:check / lint / typecheck / build / test that the repo defines (--if-present).
#            npm via package-lock.json, pnpm via pnpm-lock.yaml.
#   - .NET:  every *.sln → restore + build + test (Release)
#   - Go:    every go.mod → build + vet + test
#
# CD is NOT here: deploys are driven by the deployer's repo-level webhook (push branch → tier).
# This workflow is the quality gate only — wire it as a required check on staging/main.
#
# v1 caveats (tracked as follow-ups): builds ALL discovered workspaces every run (no change
# detection yet); no dependency cache yet; pnpm repos should pin via package.json "packageManager".
name: CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: '20'
      dotnet-version:
        description: .NET SDK version
        type: string
        default: '9.0.x'
      go-version:
        description: Go version
        type: string
        default: '1.23'

permissions:
  contents: read

jobs:
  discover:
    name: Discover workspaces
    runs-on: ubuntu-latest
    outputs:
      node_dirs: ${{ steps.scan.outputs.node_dirs }}
      has_dotnet: ${{ steps.scan.outputs.has_dotnet }}
      has_go: ${{ steps.scan.outputs.has_go }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        shell: bash
        run: |
          set -euo pipefail
          node_dirs=$(find . -name package.json -not -path '*/node_modules/*' -printf '%h\n' \
            | sed 's|^\./||' | sort -u | grep -v '^$' | jq -R . | jq -cs .)
          [ -z "$node_dirs" ] && node_dirs='[]'
          echo "node_dirs=$node_dirs" >> "$GITHUB_OUTPUT"
          echo "Node workspaces: $node_dirs"
          if find . -name '*.sln' -not -path '*/node_modules/*' | grep -q .; then
            echo "has_dotnet=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_dotnet=false" >> "$GITHUB_OUTPUT"
          fi
          if find . -name go.mod -not -path '*/node_modules/*' | grep -q .; then
            echo "has_go=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
          fi

  node:
    name: Node — ${{ matrix.dir }}
    needs: discover
    if: ${{ needs.discover.outputs.node_dirs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.node_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install, lint, build, test
        shell: bash
        run: |
          set -euo pipefail
          have(){ node -e "process.exit((require('./package.json').scripts||{})['$1']?0:1)"; }
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            grep -q '"packageManager"' package.json || corepack prepare pnpm@9 --activate
            RUN="pnpm"; pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            RUN="npm run"; npm ci
          else
            RUN="npm run"; npm install
          fi
          # Run whichever verification scripts the repo defines — covers plain
          # apps (lint/build/test) and turbo/monorepos (format:check/typecheck).
          for s in format:check lint typecheck build test; do
            if have "$s"; then echo "::group::$s"; $RUN "$s"; echo "::endgroup::"; else echo "· no $s script"; fi
          done

  dotnet:
    name: .NET
    needs: discover
    if: ${{ needs.discover.outputs.has_dotnet == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Restore, build, test each solution
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.sln' -not -path '*/node_modules/*' | while read -r sln; do
            echo "::group::$sln"
            dotnet restore "$sln"
            dotnet build "$sln" --no-restore -c Release
            dotnet test  "$sln" --no-build -c Release --verbosity normal
            echo "::endgroup::"
          done

  go:
    name: Go
    needs: discover
    if: ${{ needs.discover.outputs.has_go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - name: Build, vet, test each module
        shell: bash
        run: |
          set -euo pipefail
          find . -name go.mod -not -path '*/node_modules/*' -printf '%h\n' | while read -r mod; do
            echo "::group::$mod"
            ( cd "$mod" && go build ./... && go vet ./... && go test ./... )
            echo "::endgroup::"
          done

  # Stable aggregator gate. Matrix/optional jobs produce dynamic or skipped
  # check names that branch protection can't require directly — so require
  # THIS one instead (context: "ci / ci-complete"). It fails if any needed
  # job failed/was cancelled; skipped (stack-not-present) is allowed.
  ci-complete:
    name: ci-complete
    needs: [discover, node, dotnet, go]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on required jobs
        shell: bash
        run: |
          set -euo pipefail
          declare -A r=(
            [discover]='${{ needs.discover.result }}'
            [node]='${{ needs.node.result }}'
            [dotnet]='${{ needs.dotnet.result }}'
            [go]='${{ needs.go.result }}'
          )
          fail=0
          for j in "${!r[@]}"; do
            echo "  $j: ${r[$j]}"
            case "${r[$j]}" in failure|cancelled) echo "::error::CI job '$j' ${r[$j]}"; fail=1;; esac
          done
          [ "$fail" = 0 ] && echo "✓ CI complete" || exit 1
