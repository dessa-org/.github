# Reusable code + dependency scanning, one place for every dessa-org repo.
#
# Three questions, three pinned, hash-verified scanners:
#   deps      osv-scanner  "does a dependency have a known vulnerability, or is it a KNOWN-MALICIOUS
#                           package?" (OSV MAL-* advisories; CVE-shaped feeds don't carry these)
#   code      opengrep     "does first-party code contain a known bug pattern?" (LGPL Semgrep fork;
#                           not CodeQL, which isn't free on private repos)
#   config    trivy        "is a Dockerfile / compose / Terraform / K8s / CI file misconfigured?"
#                           (misconfig only; osv covers package vulnerabilities)
#
# Callers add workflow-templates/code-scan.yml as .github/workflows/code-scan.yml. It runs on every
# PR, on pushes to the trunks, and NIGHTLY. The nightly run is the point: an advisory published
# after your last merge (e.g. GHSA-2xp9, 2026-09-08, a critical RCE in Next.js) only surfaces if
# something re-scans code that hasn't changed.
#
# Gate policy (v1, report-only first, per ADR 0006):
#   - A tool that fails to run is a TOOL ERROR, never "clean": it's named in the summary, raised as an
#     ::error annotation and opened in the nightly issue. It fails the job once fail-on is set; in
#     report-only (fail-on: none) it doesn't, so a registry blip can't turn every PR red. Each scanner
#     retries once before it counts as failed.
#   - A KNOWN-MALICIOUS package (OSV MAL-*) is RED regardless of fail-on.
#   - Dependency severities fail the job only at/above `fail-on` (default: none = report-only).
#   - Code and config findings are reported, never blocking, until each repo is baselined.
#   - A PR that changes scanner config (osv-scanner.toml, .opengrep/, trivy.yaml, .trivyignore, or a
#     .semgrepignore/.opengrepignore) could be suppressing its own findings. The scanners read those
#     files from the PR's own tree, so the change is flagged: a warning, a summary line naming the
#     files, and a failed job once fail-on is set. Code is also re-scanned with the base branch's rules.
#
# Alerting: on schedule / workflow_dispatch runs, dependency or config findings at or above HIGH, any
# MAL-*, or a tool error open or update ONE issue labelled `security-scan` in the calling repo (GitHub
# emails its watchers). When a nightly run comes back clean, the issue is commented on and closed.
#
# Permissions: this workflow declares none, so its job gets exactly what the caller grants. A caller that
# grants only `contents: read` still scans (the issue step then fails softly with a warning); grant
# `issues: write` too for the nightly issue. Declaring `issues: write` here made GitHub refuse to start
# the job for any caller that didn't grant it (startup_failure, seen on this PR's self-test run).
# The checkout doesn't keep the token on disk (persist-credentials: false).
#
# Same conventions as secret-scan.yml: install the pinned binary (no marketplace action, no
# license), verify it before executing, and emit JSON artifacts + a job summary instead of SARIF
# (code scanning is GHAS-gated on private repos).
#
# Owner: dessa-security. Pins (version AND sha256) mirror dessa-security/tooling/versions.env; bump
# them together. Overriding a version means passing the sha256 of that exact artifact too.
name: Code Scan

on:
  workflow_call:
    inputs:
      fail-on:
        description: >-
          Dependency severity that fails the job: 'none' (report-only, default), 'critical', or
          'high' (high and critical). MAL-* packages always fail. Tool errors, and PRs that change
          scanner config, fail once this is 'critical' or 'high'; at 'none' they're reported loudly
          but don't fail the job. Any other value is an error.
        type: string
        default: 'none'
      opengrep-config:
        description: >-
          Opengrep rules when the repo has no .opengrep/ directory. 'auto' fetches rules from the
          Semgrep registry at scan time: it needs network and tells a third party you are
          scanning. Vendor rules into .opengrep/ to avoid both.
        type: string
        default: 'auto'
      osv-scanner-version:
        type: string
        default: '2.4.0'
      osv-scanner-sha256:
        description: sha256 of osv-scanner_linux_amd64 for osv-scanner-version (from the release's osv-scanner_SHA256SUMS).
        type: string
        default: '15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0'
      trivy-version:
        type: string
        default: '0.72.0'
      trivy-sha256:
        description: sha256 of trivy_<version>_Linux-64bit.tar.gz for trivy-version (from the release's checksums.txt).
        type: string
        default: 'bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea'
      opengrep-version:
        type: string
        default: '1.26.0'
      opengrep-sha256:
        description: Opengrep publishes no checksums file; this pin is trust-on-first-use (see versions.env).
        type: string
        default: '40c21299eeddabf743b856daa843d24f9d4a027130671cd45b3b21776fd9ab26'
      issue-label:
        type: string
        default: 'security-scan'

jobs:
  scan:
    name: code-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate inputs
        id: validate
        shell: bash
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          OSV_VERSION: ${{ inputs.osv-scanner-version }}
          OSV_SHA256: ${{ inputs.osv-scanner-sha256 }}
          TRIVY_VERSION: ${{ inputs.trivy-version }}
          TRIVY_SHA256: ${{ inputs.trivy-sha256 }}
          OPENGREP_VERSION: ${{ inputs.opengrep-version }}
          OPENGREP_SHA256: ${{ inputs.opengrep-sha256 }}
        run: |
          set -euo pipefail
          bad=0
          case "$FAIL_ON" in
            none|critical|high) ;;
            *) echo "::error::fail-on must be one of none, critical, high (got '${FAIL_ON}')."; bad=1 ;;
          esac
          # check <tool> <version> <sha256> <default version> <default sha256>
          # The defaults repeat the input defaults above. A version override that leaves the default hash
          # in place would only surface later as an opaque checksum mismatch, so name it here.
          check() {
            if ! [[ "$3" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::$1-sha256 must be 64 lowercase hex characters."; bad=1
            elif [ "$2" != "$4" ] && [ "$3" = "$5" ]; then
              echo "::error::$1-version is overridden to '$2' but $1-sha256 is still the default for $4. Pass $1-sha256 for that exact release artifact (from the release's checksums file)."; bad=1
            fi
          }
          check osv-scanner "$OSV_VERSION" "$OSV_SHA256" 2.4.0 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          check trivy "$TRIVY_VERSION" "$TRIVY_SHA256" 0.72.0 bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
          check opengrep "$OPENGREP_VERSION" "$OPENGREP_SHA256" 1.26.0 40c21299eeddabf743b856daa843d24f9d4a027130671cd45b3b21776fd9ab26
          exit "$bad"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false   # the caller's token may be write-all; nothing here needs it on disk

      - name: Detect scanner-config changes (pull requests)
        id: cfg
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e   # a failure here is reported as a tool error by Summarize, not a crash
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # The checkout keeps no credentials, so authenticate just this fetch through the environment
            # (never on disk, never in argv). Private repos need it; public ones don't.
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::${auth}"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
              git fetch --no-tags --depth=1 origin "$BASE_SHA" 2> cfg-fetch.log
          fi
          if ! names=$(git diff --no-renames --name-only "$BASE_SHA" HEAD 2> cfg-diff.log); then
            echo "::error::couldn't diff this PR against its base ${BASE_SHA}, so a scanner-config change can't be ruled out."
            tail -5 cfg-fetch.log cfg-diff.log 2>/dev/null
            echo "error=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pat='(^|/)osv-scanner\.toml$|^\.opengrep(/|$)|(^|/)trivy\.ya?ml$|(^|/)\.trivyignore(\.yaml)?$|(^|/)\.(semgrep|opengrep)ignore$'
          changed=$(printf '%s\n' "$names" | grep -E "$pat")
          if [ -z "$changed" ]; then
            echo "no scanner-config changes in this PR"
            exit 0
          fi
          echo "::warning::this PR changes scanner configuration ($(printf '%s\n' "$changed" | paste -sd, - | sed 's/,/, /g')). Scanners read it from the PR's own tree, so review it before trusting this result."
          printf '%s\n' "$changed" | grep -qE '^\.opengrep(/|$)' && echo "opengrep=true" >> "$GITHUB_OUTPUT"
          delim="EOF_$(openssl rand -hex 8)"
          { echo "changed<<${delim}"; printf '%s\n' "$changed"; echo "${delim}"; } >> "$GITHUB_OUTPUT"

      - name: Install scanners (pinned + hash-verified)
        shell: bash
        env:
          OSV_VERSION: ${{ inputs.osv-scanner-version }}
          OSV_SHA256: ${{ inputs.osv-scanner-sha256 }}
          TRIVY_VERSION: ${{ inputs.trivy-version }}
          TRIVY_SHA256: ${{ inputs.trivy-sha256 }}
          OPENGREP_VERSION: ${{ inputs.opengrep-version }}
          OPENGREP_SHA256: ${{ inputs.opengrep-sha256 }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/scanners && cd /tmp/scanners
          # verify <file> <expected sha256> <tool>: never execute what doesn't match the pin
          verify() {
            if ! echo "$2  $1" | sha256sum -c -; then
              echo "::error::$3 download doesn't match the pinned $3-sha256. Refusing to run it."; exit 1
            fi
          }

          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner_linux_amd64
          verify osv-scanner_linux_amd64 "$OSV_SHA256" osv-scanner
          sudo install osv-scanner_linux_amd64 /usr/local/bin/osv-scanner

          ta="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ta}" -o "${ta}"
          verify "${ta}" "$TRIVY_SHA256" trivy
          tar -xzf "${ta}" trivy
          sudo install trivy /usr/local/bin/trivy

          curl -sSfL "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86" -o opengrep
          verify opengrep "$OPENGREP_SHA256" opengrep
          sudo install opengrep /usr/local/bin/opengrep

          osv-scanner --version | head -1
          trivy --version | head -1
          opengrep --version | head -1

      - name: Scan dependencies (osv-scanner)
        id: deps
        shell: bash
        run: |
          set -uo pipefail
          set +e   # GitHub's bash is -e by default; a non-zero scanner exit is data, not a crash
          # 0 = no vulns, 1 = vulns found, 128 = no lockfiles/packages found; anything else = tool error
          for attempt in 1 2; do
            osv-scanner scan source --recursive --format json --output-file osv.json . 2> osv.log
            rc=$?
            case "$rc" in 0|1|128) break ;; esac
            [ "$attempt" = 1 ] && { echo "osv-scanner exit $rc; retrying once in 15s"; sleep 15; }
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "osv-scanner exit $rc"; tail -5 osv.log || true

      - name: Scan code (opengrep)
        id: sast
        shell: bash
        env:
          OPENGREP_CONFIG: ${{ inputs.opengrep-config }}
          RULES_CHANGED: ${{ steps.cfg.outputs.opengrep }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          set +e   # GitHub's bash is -e by default; a non-zero scanner exit is data, not a crash
          # run_opengrep <rules> <output>: sets rc
          run_opengrep() {
            for attempt in 1 2; do   # --config auto fetches rules at scan time: retry a registry blip once
              opengrep scan --config "$1" --json --output "$2" --quiet . 2>> sast.log   # no --error: findings exit 0, real errors non-zero
              rc=$?
              [ "$rc" = 0 ] && break
              [ "$attempt" = 1 ] && { echo "opengrep exit $rc; retrying once in 15s"; sleep 15; }
            done
          }
          cfg="$OPENGREP_CONFIG"
          [ -d .opengrep ] && cfg=".opengrep"
          echo "rules: $cfg"
          run_opengrep "$cfg" sast.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "opengrep exit $rc"
          if [ "$RULES_CHANGED" = "true" ]; then
            # This PR edits .opengrep/, so also scan its code with the rules it didn't write.
            base_cfg="$OPENGREP_CONFIG"
            if git cat-file -e "${BASE_SHA}:.opengrep" 2>/dev/null; then
              rm -rf /tmp/base-rules && mkdir -p /tmp/base-rules
              if git archive "$BASE_SHA" .opengrep | tar -x -C /tmp/base-rules; then
                base_cfg="/tmp/base-rules/.opengrep"
              else
                echo "::error::couldn't extract the base branch's .opengrep"; base_cfg=""
              fi
            fi
            if [ -n "$base_cfg" ]; then
              echo "base-branch rules: $base_cfg"
              run_opengrep "$base_cfg" sast-base.json
            else
              rc=1
            fi
            echo "rc_base=$rc" >> "$GITHUB_OUTPUT"
            echo "opengrep (base-branch rules) exit $rc"
          fi
          tail -5 sast.log || true

      - name: Scan config (trivy misconfig)
        id: iac
        shell: bash
        run: |
          set -uo pipefail
          set +e   # GitHub's bash is -e by default; a non-zero scanner exit is data, not a crash
          for attempt in 1 2; do   # trivy fetches its checks bundle at scan time: retry a registry blip once
            trivy fs --scanners misconfig --format json --output trivy.json --quiet --no-progress . 2> trivy.log
            rc=$?
            [ "$rc" = 0 ] && break
            [ "$attempt" = 1 ] && { echo "trivy exit $rc; retrying once in 15s"; sleep 15; }
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "trivy exit $rc"; tail -5 trivy.log || true

      - name: Summarize
        id: sum
        if: ${{ always() && steps.validate.outcome == 'success' }}
        shell: bash
        env:
          DEPS_RC: ${{ steps.deps.outputs.rc }}
          SAST_RC: ${{ steps.sast.outputs.rc }}
          SAST_BASE_RC: ${{ steps.sast.outputs.rc_base }}
          IAC_RC: ${{ steps.iac.outputs.rc }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          CFG_OUTCOME: ${{ steps.cfg.outcome }}
          CFG_ERROR: ${{ steps.cfg.outputs.error }}
          CFG_CHANGED: ${{ steps.cfg.outputs.changed }}
          FAIL_ON: ${{ inputs.fail-on }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os

          def load(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except Exception:
                  return None

          def bucket(score):
              try:
                  s = float(score)
              except (TypeError, ValueError):
                  return None
              return "critical" if s >= 9 else "high" if s >= 7 else "medium" if s >= 4 else "low"

          def sast_count(data):
              counts = {"high": 0, "medium": 0, "low": 0}
              for r in (data or {}).get("results", []) or []:
                  s = {"ERROR": "high", "WARNING": "medium"}.get(str(r.get("extra", {}).get("severity", "")).upper(), "low")
                  counts[s] += 1
              return counts

          GH_SEV = {"CRITICAL": "critical", "HIGH": "high", "MODERATE": "medium", "MEDIUM": "medium", "LOW": "low"}
          errors, lines = [], []

          # --- scanner config changed by this PR ----------------------------------------------
          cfg_changed = [l for l in os.environ.get("CFG_CHANGED", "").splitlines() if l.strip()]
          if os.environ.get("IS_PR") == "true" and (os.environ.get("CFG_ERROR") == "true" or os.environ.get("CFG_OUTCOME") != "success"):
              errors.append("couldn't check whether this PR changes scanner config")

          # --- deps ---------------------------------------------------------------------------
          deps_rc = int(os.environ.get("DEPS_RC") or 127)
          deps_scanned = deps_rc != 128   # 128 = osv-scanner found no lockfile or manifest to scan
          osv = load("osv.json")
          dep_counts = {"critical": 0, "high": 0, "medium": 0, "low": 0, "unknown": 0}
          mal, top, seen = [], [], set()   # dedupe: the same advisory in several lockfiles counts once
          if deps_rc not in (0, 1, 128) or (deps_rc in (0, 1) and osv is None):
              errors.append(f"osv-scanner failed (exit {deps_rc})")
          for res in (osv or {}).get("results", []) or []:
              for pkg in res.get("packages", []) or []:
                  p = pkg.get("package", {})
                  name = f"{p.get('ecosystem','?')}:{p.get('name','?')}@{p.get('version','?')}"
                  vulns = {v.get("id"): v for v in pkg.get("vulnerabilities", []) or []}
                  for vid in vulns:
                      if vid and vid.startswith("MAL-"):
                          mal.append(f"{name} {vid}")
                  for g in pkg.get("groups", []) or [{"ids": [i]} for i in vulns]:
                      key = (name, tuple(sorted(g.get("ids", []))))
                      if key in seen:
                          continue
                      seen.add(key)
                      sev = bucket(g.get("max_severity"))
                      if sev is None:
                          for vid in g.get("ids", []):
                              s = GH_SEV.get(str((vulns.get(vid) or {}).get("database_specific", {}).get("severity", "")).upper())
                              if s:
                                  sev = s
                                  break
                      sev = sev or "unknown"
                      dep_counts[sev] += 1
                      if sev in ("critical", "high"):
                          top.append((0 if sev == "critical" else 1, f"**{sev}** `{name}`: {', '.join(g.get('ids', [])[:3])}"))

          # --- code ---------------------------------------------------------------------------
          sast_rc = int(os.environ.get("SAST_RC") or 127)
          sast = load("sast.json")
          if sast_rc != 0 or sast is None:
              errors.append(f"opengrep failed (exit {sast_rc})")
          sast_counts = sast_count(sast)
          sast_base_counts = None
          if os.environ.get("SAST_BASE_RC"):   # set only when this PR edits .opengrep/
              sast_base_rc = int(os.environ["SAST_BASE_RC"])
              sast_base = load("sast-base.json")
              if sast_base_rc != 0 or sast_base is None:
                  errors.append(f"opengrep with the base branch's rules failed (exit {sast_base_rc})")
              sast_base_counts = sast_count(sast_base)
          code_high = max(sast_counts["high"], (sast_base_counts or {}).get("high", 0))

          # --- config -------------------------------------------------------------------------
          iac_rc = int(os.environ.get("IAC_RC") or 127)
          trivy = load("trivy.json")
          iac_counts = {"critical": 0, "high": 0, "medium": 0, "low": 0}
          if iac_rc != 0 or trivy is None:
              errors.append(f"trivy failed (exit {iac_rc})")
          for res in (trivy or {}).get("Results", []) or []:
              for m in res.get("Misconfigurations", []) or []:
                  k = str(m.get("Severity", "")).lower()
                  if k in iac_counts:
                      iac_counts[k] += 1

          # --- verdict ------------------------------------------------------------------------
          fail_on = os.environ.get("FAIL_ON", "none")
          crit, high = dep_counts["critical"], dep_counts["high"]
          # A tool error, or a PR changing scanner config, blocks only once a repo has opted into gating;
          # report-only surfaces it loudly instead.
          blocking = ((bool(errors) or bool(cfg_changed)) and fail_on != "none") or bool(mal) or (fail_on == "critical" and crit > 0) or (fail_on == "high" and crit + high > 0)
          # Code findings stay report-only: they're in the headline and table but never raise the alert.
          alert = bool(errors) or bool(mal) or bool(cfg_changed) or crit + high > 0 or iac_counts["critical"] + iac_counts["high"] > 0

          notes = []
          if not deps_scanned:
              notes.append("dependencies NOT scanned: no lockfile/manifest found")
          if code_high:
              notes.append(f"code: {code_high} high, report-only")
          clean = "no config issues at or above high" if not deps_scanned else "no dependency/config issues at or above high"
          headline = "🚨 ACTION NEEDED" if alert else f"✅ {clean}" + (f" ({'; '.join(notes)})" if notes else "")
          lines.append(f"## Code scan: {headline}")
          lines.append("")
          if errors:
              lines.append("**Tool errors (a failed scan is not a clean scan):** " + "; ".join(errors))
              lines.append("")
          if cfg_changed:
              lines.append("### ⚠️ This PR changes scanner configuration")
              lines.append("osv-scanner, opengrep and trivy read these files from the PR's own tree, so this PR could be hiding its own findings. Review them before trusting this result:")
              lines += [f"- `{c}`" for c in cfg_changed[:30]]
              if sast_base_counts is not None:
                  lines.append("Code was also scanned with the base branch's opengrep rules (see the table).")
              lines.append("")
          mal = sorted(set(mal))
          if mal:
              lines.append(f"### 🚨 {len(mal)} KNOWN-MALICIOUS package(s)")
              lines.append("Remove them, then treat every machine and CI runner that installed them as compromised.")
              lines += [f"- `{m}`" for m in mal[:20]]
              lines.append("")
          if not deps_scanned:
              lines.append("**Dependencies: NOT scanned (no lockfile/manifest found).** The dependency row is not a clean result.")
              lines.append("")
          lines.append("| Layer | Critical | High | Medium | Low | Other |")
          lines.append("|---|---|---|---|---|---|")
          if deps_scanned:
              lines.append(f"| Dependencies (osv) | {crit} | {high} | {dep_counts['medium']} | {dep_counts['low']} | {dep_counts['unknown']} unscored |")
          else:
              lines.append("| Dependencies (osv) | **NOT scanned** | – | – | – | no lockfile/manifest found |")
          lines.append(f"| Code (opengrep) | n/a | {sast_counts['high']} | {sast_counts['medium']} | {sast_counts['low']} | report-only |")
          if sast_base_counts is not None:
              lines.append(f"| Code (opengrep, base-branch rules) | n/a | {sast_base_counts['high']} | {sast_base_counts['medium']} | {sast_base_counts['low']} | report-only |")
          lines.append(f"| Config (trivy) | {iac_counts['critical']} | {iac_counts['high']} | {iac_counts['medium']} | {iac_counts['low']} | |")
          lines.append("")
          if top:
              lines.append("### Critical / high dependency advisories")
              lines += [t for _, t in sorted(top)[:25]]
              if len(top) > 25:
                  lines.append(f"...and {len(top) - 25} more in the `code-scan-reports` artifact.")
              lines.append("")
          lines.append(f"Gate: fail-on=`{fail_on}` → **{'FAIL' if blocking else 'pass'}**. Full JSON: `code-scan-reports` artifact on [this run]({os.environ['RUN_URL']}).")

          # One line for the nightly close comment: say what was scanned, never "all scanners ran" when not.
          scanned = "Scanned: dependencies, code, config." if deps_scanned else "Scanned: code, config. Dependencies NOT scanned (no lockfile/manifest found)."
          close_note = f"{clean}, no malicious packages, no scanner errors. {scanned}"
          if code_high:
              close_note += f" Code findings (report-only): {code_high} high."

          body = "\n".join(lines)
          open("summary.md", "w").write(body + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(body + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"blocking={'true' if blocking else 'false'}\n")
              f.write(f"alert={'true' if alert else 'false'}\n")
              f.write(f"errors={'true' if errors else 'false'}\n")
              f.write(f"cfg_changed={'true' if cfg_changed else 'false'}\n")
              f.write(f"close_note={close_note}\n")
          print(body)
          PY

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: code-scan-reports
          path: |
            osv.json
            sast.json
            sast-base.json
            trivy.json
            summary.md
          if-no-files-found: ignore

      - name: Open, update or close the security-scan issue (nightly / manual runs)
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.sum.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT: ${{ steps.sum.outputs.alert }}
          CLOSE_NOTE: ${{ steps.sum.outputs.close_note }}
          LABEL: ${{ inputs.issue-label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color B60205 --description "Nightly code-scan findings (dessa-security)" --force >/dev/null
          existing=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$ALERT" = "true" ]; then
            { echo "Nightly code scan found dependency or config issues at or above **high**, a known-malicious package, or a scanner error."; echo; cat summary.md; } > issue.md
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file issue.md >/dev/null
              gh issue comment "$existing" --body "Still failing as of [run]($RUN_URL)." >/dev/null
              echo "updated issue #$existing"
            else
              gh issue create --title "Security scan: findings need attention" --label "$LABEL" --body-file issue.md
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Clean as of [run]($RUN_URL): ${CLOSE_NOTE} Closing." >/dev/null
            gh issue close "$existing" >/dev/null
            echo "closed issue #$existing"
          else
            echo "clean, no open issue"
          fi

      - name: Gate
        if: ${{ always() }}
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          SUM_OUTCOME: ${{ steps.sum.outcome }}
          BLOCKING: ${{ steps.sum.outputs.blocking }}
          ERRORS: ${{ steps.sum.outputs.errors }}
          ALERT: ${{ steps.sum.outputs.alert }}
          CFG_CHANGED: ${{ steps.sum.outputs.cfg_changed }}
        run: |
          if [ "$VALIDATE_OUTCOME" != "success" ]; then
            echo "::error::code-scan inputs are invalid (see the Validate inputs step). Nothing was scanned."; exit 1
          fi
          if [ "$SUM_OUTCOME" != "success" ]; then
            echo "::error::code-scan could not summarize results. Treat as RED until fixed."; exit 1
          fi
          if [ "$BLOCKING" = "true" ]; then
            echo "::error::code-scan gate failed (tool error, a MAL-* package, dependency severity at/above fail-on, or a PR that changes scanner config). See the job summary."; exit 1
          fi
          if [ "$ERRORS" = "true" ]; then
            echo "::error::a scanner failed to run. This is NOT a clean scan (report-only, so the job isn't failed). See the job summary."
          fi
          if [ "$CFG_CHANGED" = "true" ]; then
            echo "::warning::this PR changes scanner configuration, so its results may be self-suppressed (report-only, so the job isn't failed). See the job summary."
          fi
          if [ "$ALERT" = "true" ]; then
            echo "::warning::code-scan found high/critical dependency or config issues, or needs attention (report-only). See the job summary."
          fi
          echo "code-scan gate: pass"
