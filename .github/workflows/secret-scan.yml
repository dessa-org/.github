# Reusable secret-scanning gate — gitleaks, one place for every dessa-org repo.
#
# Per dessa-security ROADMAP Phase 1 (P0) + the 2026-06-10 program synthesis. This is the
# NON-BYPASSABLE backstop behind the gitleaks pre-commit hook: hooks alone are insufficient
# (`--no-verify`, force-push, a fresh clone on another machine all skip them) so the CI
# diff-scan is the gate that actually holds the line.
#
# Callers add a ~12-line .github/workflows/security.yml (see workflow-templates/security.yml):
#   jobs: { secret-scan: { uses: dessa-org/.github/.github/workflows/secret-scan.yml@main } }
# Branch-protection required-check context is then:  secret-scan / gitleaks
#
# Why the binary, not gitleaks/gitleaks-action: the official Action requires a (free, but
# registration-gated) GITLEAKS_LICENSE for ORG-owned repos and talks to gitleaks.io. We install
# the pinned binary directly — fully self-contained, no license, no external dependency. Same
# class of "paid/registration trap on private repos" the synthesis flagged for CodeQL.
#
# Why no SARIF→code-scanning upload: the Security tab / code-scanning API is GitHub Advanced
# Security-gated on PRIVATE repos. We emit a redacted JSON report as a build artifact + a job
# summary instead — free everywhere. Findings are redacted; the raw secret is never printed.
name: Secret Scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: Pinned gitleaks release (no leading v).
        type: string
        default: '8.30.1'
      scan-mode:
        description: >-
          'pr-range' (default) scans only the commits a PR/push introduces — fast, and the right
          gate for the new-secret class. 'full' scans entire history (use for an initial baseline
          sweep of a repo, or on a schedule).
        type: string
        default: 'pr-range'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — required for commit-range and full scans

      - name: Install gitleaks (pinned + checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ inputs.gitleaks-version }}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
          asset="gitleaks_${ver}_linux_x64.tar.gz"
          curl -sSfL "${base}/${asset}" -o /tmp/gl.tgz
          curl -sSfL "${base}/gitleaks_${ver}_checksums.txt" -o /tmp/gl.sums
          # Verify the downloaded asset against the release checksums file before executing it.
          grep " ${asset}\$" /tmp/gl.sums | sed 's#'"${asset}"'#/tmp/gl.tgz#' | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          report="gitleaks-report.json"
          args=(git . --report-format json --report-path "$report" --redact --exit-code 2)
          # Rules: the repo's own .gitleaks.toml wins. Otherwise use the ORG config at this workflow's own
          # commit, NOT gitleaks' defaults: the defaults miss password-bearing database URIs
          # (dessa-db-connection-uri), which is how such a URI sat unflagged in a repo's history.
          if [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
            echo "gitleaks rules: repo .gitleaks.toml"
          else
            cfg_url="https://raw.githubusercontent.com/dessa-org/.github/${{ github.job_workflow_sha }}/.gitleaks.toml"
            curl -sSfL "$cfg_url" -o /tmp/org-gitleaks.toml
            args+=(--config /tmp/org-gitleaks.toml)
            echo "gitleaks rules: org config @ ${{ github.job_workflow_sha }}"
          fi

          mode="${{ inputs.scan-mode }}"
          if [ "$mode" = "full" ]; then
            echo "Scanning full history…"
          else
            event="${{ github.event_name }}"
            if [ "$event" = "pull_request" ] || [ "$event" = "pull_request_target" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi
            zero="0000000000000000000000000000000000000000"
            if [ -z "$base" ] || [ "$base" = "$zero" ]; then
              echo "No usable base ref (new branch / first push) → scanning full history."
            else
              echo "Scanning range ${base}..${head}"
              args+=(--log-opts="${base}..${head}")
            fi
          fi

          # gitleaks exits 0 = clean, 2 = leaks found (our --exit-code), other = tool error.
          set +e
          gitleaks "${args[@]}"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload redacted report
        if: ${{ always() && hashFiles('gitleaks-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: Gate
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rc="${{ steps.scan.outputs.rc }}"
          case "$rc" in
            0)
              echo "✓ gitleaks: no secrets detected"
              ;;
            2)
              {
                echo "## 🚨 Secret scan FAILED"
                echo "gitleaks found one or more potential secrets in this change."
                echo ""
                echo "**Do NOT paste the secret anywhere.** A committed secret is compromised the moment it lands in git history."
                echo "1. **Rotate it first** (treat as leaked — see the AWS disable-first playbook in dessa-security)."
                echo "2. Remove it from the code; load it from dessa-vault / a CI secret instead."
                echo "3. If it is a true false positive, add a scoped allowlist entry to \`.gitleaks.toml\` or a \`.gitleaksignore\` fingerprint — never a blanket skip."
                echo ""
                echo "Findings (redacted) are in the **gitleaks-report** artifact on this run."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::gitleaks found potential secrets — see the gitleaks-report artifact. Rotate before doing anything else."
              exit 1
              ;;
            *)
              echo "::error::gitleaks failed to run (exit $rc) — this is a tooling error, not a clean result. Treat the gate as RED until fixed."
              exit 1
              ;;
          esac
