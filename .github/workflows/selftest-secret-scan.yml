# Self-test for the reusable secret-scan workflow, on every PR that changes it or the org config.
#  1. It runs the workflow as a least-privilege caller (contents: read), forcing the EMBEDDED org config
#     (config-source: org). This repo has its own .gitleaks.toml, so 'auto' would never exercise that path.
#  2. It fails if the config embedded in secret-scan.yml has drifted from /.gitleaks.toml (byte-for-byte).
#     The check parses the workflow as YAML and reads the heredoc out of the scan step's `run`, which is
#     exactly the text bash receives. It never guesses at indentation.
name: Self-test Secret Scan

on:
  pull_request:
    paths:
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/selftest-secret-scan.yml'
      - '.gitleaks.toml'

permissions:
  contents: read

jobs:
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    with:
      config-source: 'org'

  embedded-config-matches:
    name: embedded org config == /.gitleaks.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - name: Compare byte-for-byte (YAML-aware)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib, hashlib, sys

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          try:
              import yaml
          except ImportError:
              fail("PyYAML is not installed, so the embedded config can't be extracted reliably. Failing closed.")

          MARK = "DESSA_ORG_GITLEAKS_TOML"
          with open(".github/workflows/secret-scan.yml", encoding="utf-8") as f:
              wf = yaml.safe_load(f)
          steps = [s for s in wf["jobs"]["gitleaks"]["steps"] if s.get("id") == "scan"]
          if len(steps) != 1:
              fail("secret-scan.yml: expected exactly one step with id 'scan' in jobs.gitleaks")
          lines = steps[0].get("run", "").split("\n")
          starts = [i for i, l in enumerate(lines) if l.rstrip().endswith(f"<<'{MARK}'")]
          if len(starts) != 1:
              fail(f"expected exactly one <<'{MARK}' heredoc in the scan step, found {len(starts)}")
          ends = [i for i in range(starts[0] + 1, len(lines)) if lines[i] == MARK]
          if not ends:
              fail(f"no {MARK} terminator line after the heredoc start")
          body = lines[starts[0] + 1:ends[0]]
          embedded = ("\n".join(body) + "\n").encode("utf-8") if body else b""
          with open(".gitleaks.toml", "rb") as f:
              canonical = f.read()

          # The runner expands GitHub expressions anywhere in `run`, heredocs included, so an opener in
          # the config would silently change what gitleaks receives.
          opener = b"$" + b"{{"
          for name, blob in (("embedded org config", embedded), ("/.gitleaks.toml", canonical)):
              if opener in blob:
                  fail(f"{name} contains a GitHub expression opener, which the runner would expand. Remove it.")
          if not embedded.strip():
              fail("embedded org config is empty")
          if embedded != canonical:
              diff = difflib.unified_diff(embedded.decode().splitlines(), canonical.decode().splitlines(),
                                          "embedded", "/.gitleaks.toml", lineterm="", n=1)
              print("\n".join(list(diff)[:40]))
              fail("secret-scan.yml's embedded org config differs from /.gitleaks.toml. Update both together.")
          print(f"embedded org config matches /.gitleaks.toml (sha256 {hashlib.sha256(canonical).hexdigest()[:16]})")
          PY
