# Self-test: run the reusable secret-scan workflow on every PR that changes it, as a least-privilege
# caller (contents: read). Its log shows the resolved reusable-workflow sha ("reusable workflow sha: …"),
# which the org-config fetch depends on. This repo has its own .gitleaks.toml, so the rules line reads
# "repo .gitleaks.toml" here. Callers without one fetch the org config at that sha.
name: Self-test Secret Scan

on:
  pull_request:
    paths:
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/selftest-secret-scan.yml'
      - '.gitleaks.toml'

permissions:
  contents: read

jobs:
  secret-scan:
    # Remote form on purpose, exactly as consumers call it (a local ./ call leaves github.job_workflow_sha
    # empty, which run dbefc06 showed). Keep this ref in step with the branch under test.
    uses: dessa-org/.github/.github/workflows/secret-scan.yml@ci/secret-scan-org-config
