# Self-test for the reusable secret-scan workflow, on every PR that changes it or the org config.
#  1. It runs the workflow as a least-privilege caller (contents: read), forcing the EMBEDDED org config
#     (config-source: org). This repo has its own .gitleaks.toml, so 'auto' would never exercise that path.
#  2. It fails if the config embedded in secret-scan.yml has drifted from /.gitleaks.toml (byte-for-byte).
name: Self-test Secret Scan

on:
  pull_request:
    paths:
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/selftest-secret-scan.yml'
      - '.gitleaks.toml'

permissions:
  contents: read

jobs:
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    with:
      config-source: 'org'

  embedded-config-matches:
    name: embedded org config == /.gitleaks.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: Compare byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          awk '/<<.DESSA_ORG_GITLEAKS_TOML.$/{f=1;next} /^ *DESSA_ORG_GITLEAKS_TOML$/{f=0} f' .github/workflows/secret-scan.yml \
            | sed -E 's/^ {10}//' > /tmp/embedded.toml
          [ -s /tmp/embedded.toml ] || { echo "::error::no embedded config found (marker changed?)"; exit 1; }
          if cmp -s /tmp/embedded.toml .gitleaks.toml; then
            echo "embedded org config matches /.gitleaks.toml (sha256 $(sha256sum .gitleaks.toml | cut -c1-16))"
          else
            diff <(cat /tmp/embedded.toml) .gitleaks.toml | head -20
            echo "::error::secret-scan.yml's embedded org config differs from /.gitleaks.toml. Update both together."; exit 1
          fi
