# Standard Dessa portfolio secret-scan gate. Drop this in as .github/workflows/security.yml —
# nothing to configure. Runs gitleaks against the commits each PR/push introduces.
#
# Roll out REPORT-ONLY first (this file, no required check) → confirm green → then make
# "secret-scan / gitleaks" a required status check on the protected branches AND toggle on
# "Do not allow bypassing the above settings" so admins / auto-merge can't override a red gate.
# See dessa-security/scanning/gitleaks/README.md for the exact branch-protection steps.
name: Security

on:
  # Every pull request, whatever branch it targets.
  #
  # This used to read `branches: [...]`, which matches the pull request's BASE.
  # It looked like "scan PRs into our trunks" and meant "exempt every stacked
  # PR" — a PR based on another feature branch was never scanned, and those are
  # exactly the branches that get force-pushed and rebased most.
  pull_request:
  push:
    branches: [develop, staging, main]

permissions:
  contents: read

jobs:
  secret-scan:
    uses: dessa-org/.github/.github/workflows/secret-scan.yml@main
    # Override defaults only if needed:
    # with:
    #   gitleaks-version: '8.30.1'
    #   scan-mode: 'pr-range'   # or 'full' for an initial baseline sweep
